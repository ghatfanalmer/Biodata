<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vander Morder - 안녕, 세상아.</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Korean (Noto Sans KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0b0c0e;
            /* Pola Latar Kotak (Grid Pattern) */
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Animasi miring stop-motion (langsung berpindah posisi tanpa transisi halus) */
        @keyframes tiltStopMotion {
            0%, 49.9% {
                transform: rotate(-6deg);
            }
            50%, 99.9% {
                transform: rotate(6deg);
            }
        }

        /* Pulse stop-motion untuk titik oranye */
        @keyframes dotStopMotion {
            0%, 49.9% {
                opacity: 1;
                transform: scale(1);
            }
            50%, 99.9% {
                opacity: 0.7;
                transform: scale(1.15);
            }
        }

        .animate-tilt {
            display: inline-block;
            /* steps(1) membuat efek patah-patah instant/stop-motion tiap 1 detik */
            animation: tiltStopMotion 2s steps(1) infinite;
            transform-origin: bottom center;
        }

        .dot-accent {
            color: #ff8c32;
            display: inline-block;
            animation: dotStopMotion 2s steps(1) infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center text-white px-4 select-none overflow-hidden">

    <main class="text-center space-y-6 md:space-y-8 z-10">
        <!-- Main Korean Text with Stop-Motion Tilt Animation -->
        <h1 class="text-5xl sm:text-7xl md:text-8xl font-black tracking-tight leading-tight">
            <span class="animate-tilt">안녕, 세상아</span><span class="dot-accent">.</span>
        </h1>

        <!-- Subheading -->
        <p class="text-lg sm:text-xl md:text-2xl font-normal tracking-wide">
            <span class="text-[#8b9bb4]">저는</span>
            <span class="text-white font-semibold mx-1">Vander Morder</span><span class="text-[#8b9bb4]">.</span>
        </p>

        <!-- Domain Footer -->
        <div class="pt-6">
            <p class="text-xs sm:text-sm text-[#6c7a89] tracking-widest font-mono">
                ghatfan.my.id
            </p>
        </div>
    </main>

</body>
</html>
