<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vander</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #121316;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #ffffff;
        }

        .container {
            text-align: center;
        }

        .heading {
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
        }

        .dot {
            color: #ff8c32;
        }

        .subheading {
            font-size: 1.25rem;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        .korean-text {
            color: #8b9bb4;
        }

        .name {
            color: #ffffff;
            font-weight: 600;
        }

        .domain {
            font-size: 0.9rem;
            color: #6c7a89;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="heading">안녕, 세상아<span class="dot">.</span></h1>
        <p class="subheading">
            <span class="korean-text">저는</span> 
            <span class="name">Vander</span><span class="korean-text">.</span>
        </p>
        <p class="domain">ghatfan.my.id</p>
    </div>

</body>
</html>
